name: Windows Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        run: msbuild SnakeGame.sln /p:Configuration=Release /m

      - name: Run engine checks
        run: .\SnakeGame.Tests\bin\Release\SnakeGame.Tests.exe

      - name: Package app artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\SnakeGame
          Copy-Item bin\Release\SnakeGame.exe artifacts\SnakeGame\
          Copy-Item bin\Release\SnakeGame.exe.config artifacts\SnakeGame\
          Copy-Item README.md artifacts\SnakeGame\
          Copy-Item docs artifacts\SnakeGame\docs -Recurse

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnakeGame-Windows-Release
          path: artifacts/SnakeGame
